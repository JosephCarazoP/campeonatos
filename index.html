<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Torneo FIFA 26</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-glow1"></div>
  <div class="bg-glow2"></div>
  <div class="bg-grid"></div>

  <header>
    <div class="badge">FIFA 26</div>
    <h1>TORNEO</h1>
    <p class="subtitle">⚽ Champions League de Amigos</p>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <p class="progress-label" id="progressLabel">0/10 partidos jugados</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('matches')">⚽ Partidos</button>
    <button class="tab" onclick="switchTab('table')">🏆 Tabla</button>
  </div>

  <div class="content">
    <div id="matchesTab">

      <!-- LEO BANNER -->
      <div class="leo-banner" id="leoBanner">
        <div class="leo-banner-left">
          <span class="leo-icon">🦁</span>
          <div>
            <div class="leo-title">¿Llega Leo?</div>
            <div class="leo-sub">Si no llega, se aplican WO 3-0 automáticos</div>
          </div>
        </div>
        <div class="leo-actions">
          <button class="btn-leo btn-leo-yes" onclick="setLeoStatus('yes')">✅ Sí llega</button>
          <button class="btn-leo btn-leo-no" onclick="setLeoStatus('no')">❌ No llega (WO)</button>
        </div>
      </div>

      <!-- IDA (vuelta 1) -->
      <div class="session-label"><span class="dot"></span> Ida — Desde las 5:00 PM</div>
      <div id="session1"></div>

      <!-- Leo session or vuelta label -->
      <div class="session-label" style="margin-top:24px" id="leoSessionLabel">
        <span class="dot yellow"></span>
        <span id="leoSessionText">Desde las 7:00 PM — 🦁 Llega Leo</span>
      </div>
      <div id="session2"></div>

      <!-- VUELTA section (hidden until Leo confirmed or not) -->
      <div id="vueltaSection" style="display:none">
        <div class="session-label" style="margin-top:24px"><span class="dot pink"></span> Vuelta</div>
        <div id="sessionVuelta"></div>
      </div>

    </div>

    <div id="tableTab" style="display:none">
      <div class="table-wrap">
        <div class="table-header">
          <span class="col-name">Jugador</span>
          <span class="col">PJ</span>
          <span class="col">V</span>
          <span class="col">E</span>
          <span class="col">D</span>
          <span class="col">GF</span>
          <span class="col">GC</span>
          <span class="col">DIF</span>
          <span class="col pts-col">PTS</span>
        </div>
        <div id="standingsBody"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
